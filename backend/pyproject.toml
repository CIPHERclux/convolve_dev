[project]
name = "convolve-mas"
version = "0.1.0"
description = "Multimodal mental health support system with emotional memory"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults (needed for Depends())
    "SIM108",  # use ternary operator (reduces readability)
    "UP007",   # use X | Y for union types (not always clearer)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
